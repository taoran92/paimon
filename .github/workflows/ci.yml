name: CDC charset Windows validation

on:
  push:
    branches: [fix/cdc-json-utf8-windows-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx4g -Dmaven.wagon.http.retryHandler.count=3
      MAVEN_REPO_LOCAL: '${{ github.workspace }}\windows dependencies 1\repository'
      SUBJECT_SHA: 8ee6df7f9d097d72aad65e0191085cd370c1166f
    steps:
      - name: Configure Git paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.MAVEN_REPO_LOCAL }}
          key: windows-cdc-charset-${{ hashFiles('**/pom.xml') }}
      - name: Build dependency closure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-validation-results | Out-Null
          java -version
          mvn -version
          & mvn.cmd -B -ntp -T 2 "-Dmaven.repo.local=$env:MAVEN_REPO_LOCAL" `
            -pl paimon-flink/paimon-flink-cdc -am '-Pfast-build,flink1' `
            -DskipTests install 2>&1 | Tee-Object windows-validation-results/build.log
          if ($LASTEXITCODE -ne 0) { throw "Dependency build failed: $LASTEXITCODE" }
      - name: Compare old and new launcher on JDK 8
        shell: pwsh
        run: ./.github/scripts/verify-cdc-windows.ps1 -JavaVersion 8
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
      - name: Compare old and new launcher on JDK 11
        shell: pwsh
        run: ./.github/scripts/verify-cdc-windows.ps1 -JavaVersion 11
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-cdc-charset-evidence
          path: windows-validation-results/
          retention-days: 7
